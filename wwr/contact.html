<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">

    <meta name="description"
      content="Contact White Water Rafting for trip information, reservations, and questions about our exciting river adventures.">

    <meta name="author" content="Lawren Talamaivao">

</head>

<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="hero">

            <img src="images/hero.jpg" alt="White water rafting adventure">

            <h1>Contact Us</h1>


        </section>


        <section class="contact-area">

            <div>
                <h2>Get in Touch</h2>

                <p>
                    Have questions about our rafting trips?
                    Contact us and our team will be happy to help.
                </p>

                <p>
                    Phone: (123) 456-7890
                </p>

                <p>
                    Email: info@whitewaterrafting.com
                </p>

            </div>

            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15496.669725471565!2d-171.7556626546726!3d-13.828982731448622!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x71a513a599b62e31%3A0x6992904e3c2c1a3d!2sTaumeasina%20Island%20Resort!5e0!3m2!1sen!2sws!4v1785283647646!5m2!1sen!2sws"
                  width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">

                </iframe>

            </div>

        </section>


        <section class="contact-form">

            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="message">Message:</label>
                <textarea id="message" name="message"></textarea>

                <button type="submit">Send</button>

            </form>

        </section>
    </main>

    <footer>

        <p>
            &copy; 2026 White Water Rafting | Lawren Talamaivao
        </p>

        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook.png.jpg" alt="Facebook social media icon">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png.webp" alt="Instagram social media icon">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png.webp" alt="LinkedIn social media icon">
            </a>

        </nav>

    </footer>

</body>

</html>
