<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
        content="Contact White Water Rafting for reservations, questions, and trip information.">

    <meta name="author" content="Lawren Talamaivao">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>

        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="company-info">
            <h1>White Water Rafting Company</h1>

            <p><strong>123 Main River Street</strong></p>
            <p><strong>Kolob, California</strong></p>
            <p><strong>+1 (999) 999-9999</strong></p>
            <p><strong>info@whitewater.com</strong></p>
        </section>

        <section class="contact-grid">

            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d19344.90299045496!2d-171.76961861167075!3d-13.829732772687402!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sws!4v1785354778820!5m2!1sen!2sws"
                    loading="lazy"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
            </div>

            <div class="contact-form">

                <form>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>

                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                    <p><strong>Message Purpose</strong></p>

                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                    <label for="message">Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Type your message here"
                        required></textarea>

                    <label>
                        <input type="checkbox" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

        <section class="employees">

            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.jpg" alt="Lead River Guide">
                    <figcaption>John Smith – Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.webp" alt="Trip Coordinator">
                    <figcaption>Sarah Jones – Trip Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.webp" alt="Safety Instructor">
                    <figcaption>Jason Brown – Safety Instructor</figcaption>
                </figure>

            </div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 White Water Rafting | Lawren Talamaivao</p>

        <nav class="socialmedia" aria-label="Social Media Links">

            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
                <img src="images/instagram.png.webp" alt="Instagram">
            </a>

            <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer">
                <img src="images/linkedin.png.webp" alt="LinkedIn">
            </a>

        </nav>

    </footer>

</body>

</html>
